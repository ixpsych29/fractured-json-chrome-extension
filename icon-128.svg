<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Chrome Web Store Guidelines: 
    - 128x128 total size
    - 96x96 actual artwork centered (16px transparent padding on all sides)
  -->
  <rect x="16" y="16" width="96" height="96" rx="21" fill="#1E1E2E" />
  
  <!-- Fractured braces, scaled down to fit inside the 96x96 artwork area -->
  <g transform="translate(64, 64) scale(0.75)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Top-Left { piece -->
    <path d="M -16, -41 Q -30, -41 -30, -27 L -30, -15 Q -30, -5 -42, -5" stroke="#F38BA8" />
    <!-- Bottom-Left { piece -->
    <path d="M -34, 5 Q -22, 5 -22, 15 L -22, 27 Q -22, 41 -8, 41" stroke="#FAB387" />

    <!-- Top-Right } piece -->
    <path d="M 17, -40 Q 31, -40 31, -26 L 31, -14 Q 31, -4 43, -4" stroke="#A6E3A1" />
    <!-- Bottom-Right } piece -->
    <path d="M 33, 4 Q 21, 4 21, 14 L 21, 26 Q 21, 40 7, 40" stroke="#89B4FA" />

  </g>

  <!-- Fractured colon in the middle -->
  <g transform="translate(64, 64) scale(0.75)">
    <circle cx="-2" cy="-8" r="5.5" fill="#F9E2AF" />
    <circle cx="2" cy="10" r="5.5" fill="#CBA6F7" />
  </g>
</svg>
